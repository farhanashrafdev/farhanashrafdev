# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics

on:
  push:
    branches: [master]
    # Generated SVGs are committed back by this workflow. Ignoring them
    # prevents the commit from re-triggering this run.
    paths-ignore:
      - "**.svg"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Pinned to v3.34 by commit SHA: this action receives a PAT, so a mutable
      # ref (@latest / @main) would be a supply-chain risk.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: farhanashrafdev
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_lines: yes
          plugin_stargazers: yes
